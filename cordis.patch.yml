# dsh-layerfs bundle layer, applied after dsh-base and dsh-web-app.
#
# Two session modes: a session in a LayerFS project workspace works in that
# project with its own Workspace mount and scratch folder; a session anywhere
# else (a folder workspace, DSH's default workspace, the Scratch workspace)
# runs as stock DSH.
#
# - `layerfs`: the plugin (host services + browser half). `root` holds the
#   LayerFS home, the projects' scratch-folder workspaces and plugin state;
#   `scratchProject` names the project sessions bound to the Scratch project
#   used before folder sessions became plain.
# - `session-persistence-jsonl` is replaced by `layerfs-session-persistence`
#   (same root): DSH's JSONL backend keeps running inside it as the local
#   log, and a session missing locally is imported from the LayerFS project
#   that stores it.
# - `sandbox-policy` is replaced by a subclass that makes a bound session's
#   LayerFS Workspace mount (its working directory) its workspace-write root;
#   sessions with no binding fall back to the stock policy.
- id: session-persistence-jsonl
  disabled: true
- id: sandbox-policy
  disabled: true
- insert:
    - id: layerfs-session-persistence
      name: dsh-layerfs/session-persistence
      config:
        root: !!js dshHomePath('sessions')
    - id: layerfs
      name: dsh-layerfs
      config:
        root: !!js dshHomePath('layerfs')
        scratchProject: dsh-scratch/scratch
        checkpoints: turn
        idleMinutes: 30
    - id: layerfs-sandbox-policy
      name: dsh-layerfs/sandbox-policy
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()
