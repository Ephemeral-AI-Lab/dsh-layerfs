# dsh-layerfs bundle layer, applied after dsh-base and dsh-web-app.
#
# Two session modes: a session in a LayerFS project workspace works in that
# project with its own Workspace mount and scratch folder; a session anywhere
# else (a folder workspace, DSH's default workspace, the Scratch workspace)
# runs as stock DSH.
#
# - `layerfs`: the plugin (host services + browser half). `root` holds the
#   LayerFS home, the projects' scratch-folder workspaces and plugin state;
#   `scratchProject` names the project sessions bound to the Scratch project
#   used before folder sessions became plain.
# - `session-persistence-jsonl` is replaced by `layerfs-session-persistence`
#   (same root): DSH's JSONL backend keeps running inside it as the local
#   log, and a session missing locally is imported from the LayerFS project
#   that stores it.
# - `sandbox-policy` is replaced by a subclass that makes a bound session's
#   LayerFS Workspace mount (its working directory) its workspace-write root;
#   sessions with no binding fall back to the stock policy.
# - `preset-layerfs` is the Agent composition every bound session selects: bash
#   plus delegation/background tools, no host filesystem tools, so sessions on
#   remote machines work the same way — through the LayerFS CLI the host
#   exposes as `$DSH_LAYERFS_CLI` — as sessions on a native mount.
- id: session-persistence-jsonl
  disabled: true
- id: sandbox-policy
  disabled: true
- insert:
    - id: layerfs-session-persistence
      name: dsh-layerfs/session-persistence
      config:
        root: !!js dshHomePath('sessions')
    - id: layerfs
      name: dsh-layerfs
      config:
        root: !!js dshHomePath('layerfs')
        scratchProject: dsh-scratch/scratch
        checkpoints: turn
        idleMinutes: 30
    - id: layerfs-sandbox-policy
      name: dsh-layerfs/sandbox-policy
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()
    - id: preset-layerfs
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: layerfs
        name: LayerFS
        order: 5
        description: >-
          LayerFS project sessions: everything through bash and the LayerFS CLI
          ($DSH_LAYERFS_CLI), so a project on any machine works the same way.
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
