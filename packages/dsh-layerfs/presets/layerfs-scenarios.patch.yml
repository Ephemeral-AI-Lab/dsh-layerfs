# Scripted scenarios terminate foreground commands at their declared deadline.
- insert:
    - id: preset-layerfs-scenarios
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: layerfs-scenarios
        name: LayerFS scenarios
        description: Scripted LayerFS verification with bounded foreground commands.
        plugins:
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              promoteOnTimeout: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
