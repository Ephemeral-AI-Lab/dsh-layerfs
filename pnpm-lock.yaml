lockfileVersion: '9.0'

settings:
  autoInstallPeers: false
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/client:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
      '@dsh-layerfs/view':
        specifier: workspace:*
        version: link:../view

  packages/dsh-layerfs:
    dependencies:
      '@dsh-layerfs/client':
        specifier: workspace:*
        version: link:../client
      '@dsh-layerfs/host':
        specifier: workspace:*
        version: link:../host
      '@dsh-layerfs/mock':
        specifier: workspace:*
        version: link:../mock

  packages/host:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
      '@layerfs/agent':
        specifier: link:../../.layerfs/sdk/js/packages/agent
        version: link:../../.layerfs/sdk/js/packages/agent
      '@layerfs/backend':
        specifier: link:../../.layerfs/sdk/js/packages/backend
        version: link:../../.layerfs/sdk/js/packages/backend
      '@layerfs/runtime':
        specifier: link:../../.layerfs/sdk/js/packages/runtime
        version: link:../../.layerfs/sdk/js/packages/runtime

  packages/mock: {}

  packages/model: {}

  packages/view:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
