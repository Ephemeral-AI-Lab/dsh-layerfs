lockfileVersion: '9.0'

settings:
  autoInstallPeers: false
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/client:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
      '@dsh-layerfs/view':
        specifier: workspace:*
        version: link:../view

  packages/dsh-layerfs:
    dependencies:
      '@dsh-layerfs/client':
        specifier: workspace:*
        version: link:../client
      '@dsh-layerfs/host':
        specifier: workspace:*
        version: link:../host

  packages/host:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
      '@layerfs/sdk':
        specifier: link:../../.layerfs/sdk/js
        version: link:../../.layerfs/sdk/js

  packages/model: {}

  packages/view:
    dependencies:
      '@dsh-layerfs/model':
        specifier: workspace:*
        version: link:../model
